version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Expose port 80 internally for Coolify proxy
    # Coolify will route external traffic to this port
    expose:
      - "80"
    restart: unless-stopped
    # More reliable health check for Alpine nginx
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
