version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Expose port 80 internally for Coolify proxy
    # Coolify will route external traffic to this port
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
